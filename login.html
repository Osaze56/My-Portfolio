<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
</head>
<style>
  * {
    margin: 0;
    box-sizing: border-box;
    font-family: sans-serif;
    /* background: rgba(235, 211, 192, 0.171); */
    /* background: grey; */
  }

  body {
    background-image: url(stunning-high-resolution-nature-and-landscape-backgrounds-breathtaking-scenery-in-hd-free-photo.jpg);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;
    margin: 0;
    padding: 0;
    backdrop-filter: blur(3px);
    font-family: sans-serif;
  }

  .container {
    display: flex;
    margin: 100px auto;
    justify-content: center;
    align-items: center;
    width: 350px;
    height: 350px;
    background: rgba(3, 71, 94, 0.274);
    border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.51);
    -webkit-box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.51);
    -moz-box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.51);
    transition: 1s;
    position: relative;
  }

  .container:hover {
    transition: 1s;
    border-radius: 35% 65% 29% 71% / 58% 46% 54% 42%;
  }

  .container::after {
    content: "";
    /* content: "Guest Acc."; */
    /* display: flex;
        text-align: center;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: rgb(83, 4, 4);
        font-weight: bold; */
    position: absolute;
    top: 19px;
    left: 390px;
    width: 15%;
    height: 15%;
    background-color: rgba(255, 255, 255, 0.767);
    border-radius: 50%;
    z-index: -1;
    /* filter: blur(8px); */
    transform: scale(1.05);
    box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.51);
    -webkit-box-shadow: 5px 5px 5px 0px rgba(0, 0, 0, 0.51);
    -moz-box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.51);
    transition: 1s;
  }

  .container::before {
    content: "";
    position: absolute;
    top: 70px;
    left: 370px;
    width: 10%;
    height: 10%;
    background-color: rgba(255, 255, 255, 0.712);
    /* light overlay */
    z-index: -1;
    box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.51);
    -webkit-box-shadow: 5px 5px 5px 0px rgba(0, 0, 0, 0.51);
    -moz-box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.51);
    transition: 1s;
    border-radius: 50%;


  }


  .container form {
    width: 300px;
    height: 300px;
    padding-top: 50px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .container form div {
    margin: 15px auto;
    align-items: center;
    justify-content: center;
    display: flex;

  }

  .container form div label {
    color: #fff;
    font-size: larger;
    font-weight: bold;
  }

  .container form div input {
    height: 30px;
    float: right;
    display: flex;
    margin-left: 10px;
    outline: none;
    color: rgb(3, 71, 94);
    font-weight: bold;
    border-radius: 10px;
    outline: 0;
    padding-left: 4px;
  }

  input::placeholder {
    color: gray;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 2px;
  }


  .container form button {
    background: rgb(255, 255, 255);
    outline: none;
    border: none;
    width: 110px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 25px auto;
    border-radius: 10px;
    transition: 0.3s;
    box-shadow: 5px 6px 5px 0px rgba(0, 0, 0, 0.51) inset;
    -webkit-box-shadow: 5px 6px 5px 0px rgba(0, 0, 0, 0.51) inset;
    -moz-box-shadow: 5px 6px 5px 0px rgba(0, 0, 0, 0.51) inset;
  }

  .container form button {
    text-decoration: none;
    line-height: 35px;
    color: rgb(3, 71, 94);
    font-size: large;
    font-weight: bolder;
    width: 110px;
  }

  .container form button:hover {
    transform: scale(1.1);
    transition: 0.3s;
  }

  .container .forget_password {
    display: flex;
    background: #06b49da6;
    width: 100px;
    height: 100px;
    position: absolute;
    border-radius: 57% 43% 73% 27% / 68% 55% 45% 32%;
    /* right: -95px; */
    left: 10px;
    top: 380px;
    color: #fff;
    transition: 1s;
    box-shadow: -2px -6px 5px 4px rgba(0, 0, 0, 0.75) inset;
    -webkit-box-shadow: -2px -6px 5px 4px rgba(0, 0, 0, 0.75) inset;
    -moz-box-shadow: -2px -6px 5px 4px rgba(0, 0, 0, 0.75) inset;
  }

  .container .forget_password:hover {
    border-radius: 50%;
  }

  .container .forget_password p {
    align-items: center;
    display: flex;
    text-align: center;

  }

  .container .forget_password p a {
    text-decoration: none;
    color: #fff;
    height: 70px;
    width: 80px;
    /* background: red; */
    display: flex;
    align-items: center;
    text-align: center;
    position: absolute;
    left: 10px;
  }

  .container .forget_password:hover {
    transform: scale(1.1);
    transition: 0.3s;
  }













  .container .register {
    display: flex;
    background: #b41206a6;
    width: 80px;
    height: 50px;
    position: absolute;
    border-radius: 57% 43% 73% 27% / 68% 55% 45% 32%;
    right: 10px;
    top: 390px;
    transition: 1s;
    box-shadow: -2px -6px 5px 4px rgba(0, 0, 0, 0.75) inset;
    -webkit-box-shadow: -2px -6px 5px 4px rgba(0, 0, 0, 0.75) inset;
    -moz-box-shadow: -2px -6px 5px 4px rgba(0, 0, 0, 0.75) inset;
    transition: 0.3s;
  }

  .container .register:hover {
    border-radius: 50%;
  }

  .container .register p {
    align-items: center;
    display: flex;
    text-align: center;

  }

  .container .register p a {
    text-decoration: none;
    color: #fff;
    height: 70px;
    width: 80px;
    /* background: red; */
    display: flex;
    align-items: center;
    text-align: center;
    position: absolute;
    left: 10px;
  }

  .container .register:hover {
    transform: scale(1.1);
    transition: 0.3s;
  }

  @media (max-width: 600px) {

    .container::after,
    .container::before {
      display: none;
    }
  }
</style>

<body>
  <div class="container">
    <form id="loginForm">
      <div>
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter your username" required />
      </div>

      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>

      <div>
        <input type="checkbox" id="rememberMe" style=" margin-top: -5px; margin-right: 8px;" required />
        <label for="rememberMe" style="display: inline; color: white; font-weight: lighter;">Remember me</label>
      </div>
      <div class="error" id="errorMsg"></div>

      <button type="submit">Login</button>
    </form>

    <div class="forget_password">
      <p>Forgot your password?</p>
    </div>

    <div class="register">
      <p><a href="#">Register</a></p>
    </div>
  </div>
  </form>
  </div>
  </div>

</body>

</html>
